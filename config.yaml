# 关键词按十个主题归组；每次回看三天，避免周末或时区造成漏检。
user_name: "ysh329"
repo_name: "nlp-arxiv-daily"
show_authors: true
show_links: true
show_badge: false
daily_lookback_days: 3
max_results: 1500
publish_readme: false
publish_gitpage: true
json_gitpage_path: "./docs/nlp-arxiv-daily-web.json"
md_gitpage_path: "./docs/index.md"
archive_gitpage_json_dir: "./docs/archive-web"
archive_gitpage_md_dir: "./docs/archive-web"
keywords:
  "端侧、嵌入式与小语言模型":
    filters: ["Embedded AI", "Edge AI", "On-Device AI", "Small Language Model", "SLM", "Android"]
  "芯片、处理器与 GPU 微架构":
    filters: ["RISC-V", "FPGA", "NPU", "Neural Processing Unit", "GPGPU", "GPU Microarchitecture", "GPU Infrastructure", "CPU"]
  "推理系统与分布式加速":
    filters: ["Inference Acceleration", "Inference System", "vLLM", "SGLang", "Distributed Acceleration"]
  "AI 基础设施、训练与智能体系统":
    filters: ["AI Infrastructure", "Training Acceleration", "Training System", "Distributed Training", "ML System", "Machine Learning System", "Agent Infrastructure", "Agentic Systems", "Agent System"]
  "编译器、EDA 与自动调优":
    filters: ["MLIR", "LLVM", "Compiler", "AI Compiler", "TVM", "Chip Design", "EDA", "LLM Auto Tuning", "Hyperparameter Optimization"]
  "模型量化、压缩与蒸馏":
    filters: ["Model Quantization", "Knowledge Distillation", "Model Compression"]
  "GPU 通信、异构计算与 HPC":
    filters: ["GPU Communication", "Heterogeneous Computing", "HPC", "High Performance Computing"]
  "算子、注意力与矩阵计算优化":
    filters: ["GEMM", "Matrix Multiplication", "Mega Kernel", "Persistent Kernel", "Operator Optimization", "Kernel Optimization", "Attention Optimization"]
  "软硬件联合优化":
    filters: ["Software-Hardware Co-design", "HW-SW Co-design"]
  "基础算子优化":
    filters: ["Layer Norm", "TopK"]
